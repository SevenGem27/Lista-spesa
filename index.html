<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Mia Spesa</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Libreria per il grafico dello storico -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- VISTA LISTA PRINCIPALE -->
    <div id="vista-lista" class="schermata attiva">
        <div class="titolo no-print">Lista della Spesa</div>
        <div id="messaggio-vuoto" class="messaggio">La lista è vuota.<br>Premi la matita per aggiungere prodotti!</div>
        <ul id="lista-spesa"></ul>
        
        <div class="no-print">
            <button id="btn-storico" class="btn-fluttuante btn-sx">📊</button>
            <button id="btn-catalogo" class="btn-fluttuante btn-dx">✏️</button>
        </div>
    </div>

    <!-- VISTA CATALOGO -->
    <div id="vista-catalogo" class="schermata" style="display: none;">
        <button class="btn-indietro no-print" onclick="cambiaVista('vista-lista')">🔙 Indietro</button>
        <h2>Catalogo Prodotti</h2>
        
        <div class="pannello-inserimento">
            <input type="text" id="input-nome" placeholder="Nome prodotto...">
            <input type="number" id="input-corsia" placeholder="Corsia (es. 1)">
            <button id="btn-salva-catalogo">Salva nel Catalogo</button>
        </div>
        <ul id="lista-catalogo"></ul>
    </div>

    <!-- VISTA STORICO -->
    <div id="vista-storico" class="schermata" style="display: none;">
        <div class="no-print intestazione-storico">
            <button class="btn-indietro" onclick="cambiaVista('vista-lista')">🔙 Indietro</button>
            <button id="btn-stampa" class="btn-stampa">📄 Salva in PDF</button>
        </div>
        <h2>Storico Spese</h2>
        <div class="contenitore-grafico">
            <canvas id="grafico-spese"></canvas>
        </div>
        <ul id="lista-storico"></ul>
    </div>

    <!-- POPUP SPESA COMPLETATA -->
    <div id="popup-spesa" class="popup" style="display: none;">
        <div class="popup-box">
            <h3>Spesa Completata! 🎉</h3>
            <p>Quanto hai speso in totale?</p>
            <input type="number" id="input-costo" step="0.01" placeholder="Es. 45.50">
            <div class="popup-bottoni">
                <button id="btn-annulla-popup" class="btn-grigio">Annulla</button>
                <button id="btn-conferma-popup" class="btn-verde">Salva e Pulisci</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
